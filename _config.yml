title: Prior Consulting
description: "Lisa Prior, executive leadership coach and change consultant, helps leaders create distinctive work cultures that engage employees and boost bottom line."
url: "https://prior-consulting-llc.github.io"
baseurl: "/priorconsulting-site"

permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
